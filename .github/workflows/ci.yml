# Tests on every push and pull request, plus a reproducibility check: compose.yaml, the binaries and their OCI images
# (digests and layouts) must come out byte for byte the same on the runner and in the pinned Go container; and the
# brain in real gVisor (sandbox-runsc).
# Least privilege: read-only token, no secrets, actions pinned by commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2" # = mise.toml
          check-latest: false
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./... && (cd wasm && GOOS=js GOARCH=wasm go vet .)
      - name: test (offline)
        run: go test -short ./...
      - name: WebAssembly verifier builds and runs
        run: |
          scripts/build-wasm.sh "$RUNNER_TEMP/wasm/verifier.wasm"
          node wasm/smoke.mjs "$RUNNER_TEMP/wasm/verifier.wasm" "$RUNNER_TEMP/wasm"

  reproducible:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          check-latest: false
          cache: false
      - name: build on the runner
        run: go run ./cmd/compose --check --oci "$RUNNER_TEMP/oci-runner" | grep -v '^wrote OCI layouts' | tee "$RUNNER_TEMP/runner.txt"
      - name: build in the pinned Go container (the image releases build in)
        run: |
          image=$(grep -o 'golang:[^"]*@sha256:[0-9a-f]*' cmd/compose/main.go)
          mkdir -p "$RUNNER_TEMP/oci-container"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/oci-container:/oci" -w /src -e GOFLAGS=-mod=readonly "$image" \
            go run ./cmd/compose --check --oci /oci | grep -v '^wrote OCI layouts' | tee "$RUNNER_TEMP/container.txt"
      - name: same compose, binary hashes, image digests and OCI layouts
        run: |
          diff "$RUNNER_TEMP/runner.txt" "$RUNNER_TEMP/container.txt"
          sudo diff -r "$RUNNER_TEMP/oci-runner" "$RUNNER_TEMP/oci-container"

  # Real gVisor (docs/22-sandbox-runner.md), required on main by a ruleset. The brain in gVisor as the VM's runner
  # runs it (rootless runsc, uid 10004, no capabilities, no_new_privs, Docker's seccomp off, no network, read-only
  # root, its memory and pids limits): runner/v0 and the harness/v1 brain conformance suite, agentd's parity
  # scenarios, the brain-crash recovery, the safety controls and the activity records behind the runner. Then the
  # hands' sandbox runtime as root with CAP_SYS_ADMIN and delegated cgroups (not in a release yet). gVisor is the
  # pinned release (sha256 of the tarball and of each binary, the same pins as sandbox/gvisor.go, which a test
  # compares), never "latest".
  sandbox-runsc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2" # = mise.toml
          check-latest: false
          cache: false
      - name: gVisor release 20261012.0 (pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gvisor.tar.bz2" https://storage.googleapis.com/gvisor/releases/release/20261012.0/x86_64/gvisor.tar.bz2
          echo "180dd277f657c1478f09490e8a9a595f7378257510b43d1d3694a769aef9ed02  $RUNNER_TEMP/gvisor.tar.bz2" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/gvisor"
          tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C "$RUNNER_TEMP/gvisor" runsc gvisor-bin/gvisor_sentry gvisor-bin/gvisor-sentry-prewarmer gvisor-bin/runsc-fd-parking
          cd "$RUNNER_TEMP/gvisor" && sha256sum -c <<'SUMS'
          56996c546dbafd5716e1d09e307a131d97eb3b6483c22a1178631751f3e0392f  runsc
          1755e10a4c9d1db4973c0155497348db3737543b4c2e6a9f663a271ee71433d5  gvisor-bin/gvisor_sentry
          46d5c028723ac5fbe40b863f95100f15a00d2aa0cd39c69d892500a988c930bd  gvisor-bin/gvisor-sentry-prewarmer
          03af90d07ea466c10ecc3e3ba839b2a59540959dd3286aea3886917cba850c11  gvisor-bin/runsc-fd-parking
          SUMS
      - name: build the test binaries and the brain
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for p in sandbox runner app; do CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/bin/$p.test" ./$p; done
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/bin/brain" ./cmd/brain
      - name: the brain in gVisor, as the CVM's runner (rootless, no capabilities)
        run: |
          # dstack's kernel has no AppArmor: here Ubuntu's restriction on unprivileged user namespaces and Docker's
          # docker-default profile (it refuses runsc's mounts) would stop rootless runsc, so both are off, as on the CVM.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          runner() {
            docker run --rm --user 10004:10003 --cap-drop ALL --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
              --security-opt no-new-privileges:true \
              --network none --read-only --tmpfs /tmp:exec,size=256m --memory 640m --memory-swap 640m --pids-limit 512 \
              -e TACY_RUNSC=/opt/gvisor/runsc -e TACY_BRAIN_BIN=/b/brain -e TACY_RUNSC_ROOTLESS=1 -e TACY_RUNSC_PLATFORM=systrap \
              -e TACY_REQUIRE_RUNSC=1 -v "$RUNNER_TEMP/gvisor:/opt/gvisor:ro" -v "$RUNNER_TEMP/bin:/b:ro" -v "$PWD:/src:ro" "$@"
          }
          runner -w /tmp alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 /b/runner.test -test.v -test.count=1
          runner -w /src/app alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
            /b/app.test -test.v -test.count=1 -test.run 'TestParity|TestBrainCrashBehindRunner|TestSafetyBehindRunner|TestActivityBehindRunner'
      - name: hands against runsc as root (systrap, then ptrace)
        run: |
          for p in systrap ptrace; do
            docker run --rm --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
              --network none -e TACY_RUNSC=/opt/gvisor/runsc -e TACY_HANDS_ROOTFS=/hands/rootfs \
              -e TACY_CGROUP_PARENT=hands -e TACY_RUNSC_PLATFORM=$p \
              -v "$RUNNER_TEMP/gvisor:/opt/gvisor:ro" -v "$RUNNER_TEMP/bin/sandbox.test:/sandbox.test:ro" \
              alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
              sh -c 'mkdir -p /hands/rootfs && cp -a /bin /sbin /lib /usr /etc /hands/rootfs/ && /sandbox.test -test.v -test.count=1'
          done
