# Generated by go run ./cmd/compose from the agent VM source. Don't edit by hand.
#
# Four processes, each in its own container with its own uid, linked only by unix sockets: agentd (front door
# and runtime; no network, no keys), brain (no network, no secrets), gatewayd (service "agentvm": the only network
# and the published port) and vaultd (the keys; no network). A one-shot setup container (root, no network) gives
# them their directories first.
#
# Every image is named by digest only: the pinned distroless base (gcr.io/distroless/static-debian13@sha256:2293b36c7c9082bf4115aab724b4d2cddec82c8eba39bf27ac0517e159acf150)
# plus one layer with the binary at /tacy/<name>. Rebuild them from the tagged source (scripts/reproduce.sh) to get
# the same digests. Binaries (linux/amd64, sha256):
#   agentd   e2ec50c2000a1f3e4991302573ad05f527be766552ad97c9763cf755bfabb266
#   brain    24be340e95b54714005043948f4f762ce0368633505df12b3b4fd2623ac6cecc
#   gatewayd 5226246a87b28a828b54db3acd26d3a48ad27347b2c2140cb3b5f49a15355b5d
#   setup    80f380d97b1cc77da758d69ba978e5f09c720f10ef853f6afa06e06ffa006de6
#   vaultd   4f18ddeef70396dbb2f2a683c0cf338ffef775a3b8de4d3c49f3d499cebf61eb
services:
  setup:
    image: ghcr.io/tacyhq/tacy/setup@sha256:7c33f77d06d41b1f14c0729fd52abbabd657ec5e418e16fd17deac35bb607a0e
    entrypoint: ["/tacy/setup"]
    network_mode: none
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - agentsock:/run/tacy/agent
      - vaultsock:/run/tacy/vault
      - brainsock2:/run/tacy/brain
      - state:/state
    command: ["-dir", "/run/tacy/agent=10003:10001:0770", "-dir", "/run/tacy/vault=10002:10001:0750", "-dir", "/run/tacy/brain=10003:65534:0750", "-remove", "/state/queue.db", "-remove", "/state/queue.db-wal", "-remove", "/state/queue.db-shm", "-remove", "/state/queue.db-journal", "-tree", "/state/agentd=10003:10003:0700"]
  agentd:
