services:
  build:
    image: golang:1.27.2-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
    restart: "no"
    volumes:
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
      - bin:/cache
      - agentsock:/run/tacy/agent
      - vaultsock:/run/tacy/vault
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: ""
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        AGENTD_SHA256=da149c9acbb9753005befd6a0c94366d318c3deafd4d1194d633c53101e762ce
        BRAIN_SHA256=24be340e95b54714005043948f4f762ce0368633505df12b3b4fd2623ac6cecc
        GATEWAYD_SHA256=52146a558a0ee800e6c119510b624aebaa606cf70e21ec990ad753eee3a7f91a
        VAULTD_SHA256=6a3215160345878d38695e7404cde176f317a0887f5294d20adc2783a8a32c7b
        pinned() { [ -f "$$2" ] && echo "$$1  $$2" | sha256sum -c -s; }
        todo=""
        for p in agentd:./app:$$AGENTD_SHA256 brain:./cmd/brain:$$BRAIN_SHA256 gatewayd:./cmd/gatewayd:$$GATEWAYD_SHA256 vaultd:./cmd/vaultd:$$VAULTD_SHA256; do
          name=$${p%%:*}; want=$${p##*:}
          pinned "$$want" "/cache/$$name-$$want" || todo="$$todo $$p"
        done
        if [ -z "$$todo" ]; then
          echo "cached binaries match the pins"
        else
          rm -rf /src && mkdir -p /src && cd /src
          # The arguments after this script are the source's base64 chunks, in order.
          for c in "$$@"; do printf '%s' "$$c"; done | tr -d '\n' | base64 -d | tar -xzf -
          echo "building$$todo (a cold build takes a few minutes on 1 vCPU)"
          for p in $$todo; do
            name=$${p%%:*}; rest=$${p#*:}; pkg=$${rest%%:*}; want=$${rest#*:}
            go build -trimpath -buildvcs=false -o /cache/$$name.tmp $$pkg
            got=$$(sha256sum /cache/$$name.tmp | cut -d' ' -f1)
            if [ "$$got" != "$$want" ]; then echo "built $$name $$got isn't the pinned $$want: refusing to start"; rm -f /cache/$$name.tmp; sleep 60; exit 1; fi
            chmod 0555 /cache/$$name.tmp && mv /cache/$$name.tmp /cache/$$name-$$want
          done
        fi
        # Socket directories, each in a volume only its two containers mount: agentd's HTTP socket and gatewayd's
        # gateway/v0 socket (agentd root, gatewayd by group); vaultd's socket (gatewayd may only enter).
        chown 0:10001 /run/tacy/agent && chmod 0770 /run/tacy/agent
        chown 10002:10001 /run/tacy/vault && chmod 0750 /run/tacy/vault
      - build
      - *src0
      - *src1
      - *src2
  agentd:
    image: golang:1.27.2-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
    network_mode: none
    restart: unless-stopped
    depends_on:
      build:
        condition: service_completed_successfully
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    group_add: ["65534", "10001"]
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - bin:/cache:ro
      - state:/state
      - brainsock:/run/tacy/brain
      - agentsock:/run/tacy/agent
    environment:
      AGENT_VM_TOKEN: ${AGENT_VM_TOKEN}
    entrypoint: ["sh", "-c"]
    command:
      - |
        AGENTD_SHA256=da149c9acbb9753005befd6a0c94366d318c3deafd4d1194d633c53101e762ce
        bin=/cache/agentd-$$AGENTD_SHA256
        until [ -f "$$bin" ]; do sleep 2; done
        if ! echo "$$AGENTD_SHA256  $$bin" | sha256sum -c -s; then echo "the agentd binary isn't the pinned one: refusing to start"; sleep 60; exit 1; fi
        exec "$$bin" -storage /state -brain-socket /run/tacy/brain/brain.sock -brain-uid 65534 -brain-gid 65534 -gateway-socket /run/tacy/agent/gateway.sock -listen-unix /run/tacy/agent/http.sock -listen-uid 10001 -listen-gid 10001 -mem-limit-mib 600
  brain:
    image: golang:1.27.2-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
    network_mode: none
    restart: unless-stopped
    depends_on:
      build:
        condition: service_completed_successfully
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - bin:/cache:ro
      - brainsock:/run/tacy/brain
    entrypoint: ["sh", "-c"]
    command:
      - |
        BRAIN_SHA256=24be340e95b54714005043948f4f762ce0368633505df12b3b4fd2623ac6cecc
        bin=/cache/brain-$$BRAIN_SHA256
        until [ -f "$$bin" ]; do sleep 2; done
        if ! echo "$$BRAIN_SHA256  $$bin" | sha256sum -c -s; then echo "the brain binary isn't the pinned one: refusing to start"; sleep 60; exit 1; fi
        exec "$$bin" --socket /run/tacy/brain/brain.sock
  agentvm:
    image: golang:1.27.2-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
    restart: unless-stopped
    depends_on:
      build:
        condition: service_completed_successfully
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "8080:8080"
    tmpfs: [/tmp]
    volumes:
      - bin:/cache:ro
      - agentsock:/run/tacy/agent
      - vaultsock:/run/tacy/vault
    environment:
      SEARCH_PROVIDER: ${SEARCH_PROVIDER}
      HOME: /tmp
    entrypoint: ["sh", "-c"]
    command:
      - |
        GATEWAYD_SHA256=52146a558a0ee800e6c119510b624aebaa606cf70e21ec990ad753eee3a7f91a
        bin=/cache/gatewayd-$$GATEWAYD_SHA256
        until [ -f "$$bin" ]; do sleep 2; done
        if ! echo "$$GATEWAYD_SHA256  $$bin" | sha256sum -c -s; then echo "the gatewayd binary isn't the pinned one: refusing to start"; sleep 60; exit 1; fi
        exec "$$bin" -socket /run/tacy/agent/gateway.sock -agent-uid 0 -vault-socket /run/tacy/vault/vault.sock -listen :8080 -forward /run/tacy/agent/http.sock
  vaultd:
    image: golang:1.27.2-alpine@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
    network_mode: none
    restart: unless-stopped
    depends_on:
      build:
        condition: service_completed_successfully
    user: "10002:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - bin:/cache:ro
      - vaultsock:/run/tacy/vault
    environment:
      TINFOIL_API_KEY: ${TINFOIL_API_KEY}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    entrypoint: ["sh", "-c"]
    command:
      - |
        VAULTD_SHA256=6a3215160345878d38695e7404cde176f317a0887f5294d20adc2783a8a32c7b
        bin=/cache/vaultd-$$VAULTD_SHA256
        until [ -f "$$bin" ]; do sleep 2; done
        if ! echo "$$VAULTD_SHA256  $$bin" | sha256sum -c -s; then echo "the vaultd binary isn't the pinned one: refusing to start"; sleep 60; exit 1; fi
        exec "$$bin" -socket /run/tacy/vault/vault.sock -gateway-uid 10001 -group-mode
volumes:
  gocache:
  gomod:
  bin:
  state:
  brainsock:
  agentsock:
  vaultsock:
