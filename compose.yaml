    command: ["-storage", "/state/agentd", "-brain-socket", "/run/tacy/brain/brain.sock", "-brain-uid", "65534", "-brain-gid", "65534", "-gateway-socket", "/run/tacy/agent/gateway.sock", "-listen-unix", "/run/tacy/agent/http.sock", "-listen-uid", "10001", "-listen-gid", "10001", "-mem-limit-mib", "600", "-firm", "f_chat"]
  brain:
    image: ghcr.io/tacyhq/tacy/brain@sha256:87109ed7e139f230fb3346f612e50ea45a965c1938ad0975d588c56277103d4f
    entrypoint: ["/tacy/brain"]
